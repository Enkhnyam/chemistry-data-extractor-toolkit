name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # The tests need no network and no API key. docling is part of every install, so the
    # Linux jobs take the CPU build of PyTorch first, as the install docs suggest, to skip
    # NVIDIA's libraries; macOS and Windows get the CPU build anyway.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: file2records --version

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check --strict dist/*
