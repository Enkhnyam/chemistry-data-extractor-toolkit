# Prose linting for docs/: `uvx vale sync` once, then `uvx vale docs README.md`.
# Google's developer documentation style guide, plus House rules for habits that make text
# read as machine-written. Runs in CI with the docs build.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, House

# "mine" means text mining in these docs, not a pronoun
Google.FirstPerson = NO
