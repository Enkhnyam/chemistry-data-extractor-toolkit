[project]
name = "chemistry-data-extractor-toolkit"
version = "0.1.0"
description = "Extract experimental data from scientific PDFs with an LLM, audit it with a second one, and review it against the source text. Schema, prompts and examples are yours to define."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "docling>=2.110.0",
    "litellm>=1.91.0",
    # litellm.completion(num_retries=...) imports tenacity lazily and litellm does not declare
    # it, so every model call on a clean install died with "tenacity import failed". We pass
    # num_retries on every call, which made that every call.
    "tenacity>=8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.1",
    "markdown-it-py>=4.0.0",
    # Only for asking an endpoint which models it serves. It arrives anyway under litellm, but
    # a direct import belongs in a direct dependency -- otherwise it vanishes the day litellm
    # changes its HTTP client.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
