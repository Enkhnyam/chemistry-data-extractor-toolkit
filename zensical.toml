[project]
site_url = "https://enkhnyam.github.io/chemistry-data-extractor-toolkit/"
site_name = "file2records"
site_description = "Turn scientific papers into a structured dataset you can check."
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/Enkhnyam/chemistry-data-extractor-toolkit"
repo_name = "chemistry-data-extractor-toolkit"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    "get-started/index.md",
    { "1. Install" = "get-started/install.md" },
    { "2. Set up API access" = "get-started/api-access.md" },
    { "3. Create a project" = "get-started/project.md" },
    { "4. Add papers" = "get-started/papers.md" },
    { "5. Define the fields" = "get-started/fields.md" },
    { "6. Write the prompt" = "get-started/prompt.md" },
    { "7. Choose papers" = "get-started/choose.md" },
    { "8. Extract" = "get-started/extract.md" },
    { "9. Judge and review" = "get-started/judge.md" },
    { "10. Export" = "get-started/export.md" },
    { "All steps in one script" = "get-started/script.md" },
  ] },
  { "Going further" = [
    { "Write better fields and prompts" = "guides/prompts.md" },
    { "Paper formats" = "guides/formats.md" },
    { "Use the command line" = "guides/command-line.md" },
  ] },
  { "Reference" = [
    { "Python API" = "reference/python.md" },
    { "Command line" = "reference/cli.md" },
  ] },
  { "Examples" = [
    { "RWTH KI:connect" = "examples/rwth-kiconnect.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
